  <rect x="40" y="80" width="195" height="80" rx="10" fill="#ffffff" stroke="#21a97d" stroke-width="2.5"/>
  <text x="137" y="112" text-anchor="middle" font-size="18" font-weight="bold" fill="#344956">Autocomplete</text>
  <text x="137" y="136" text-anchor="middle" font-size="14" fill="#8C8C8C">a line at a time</text>
  <rect x="250" y="80" width="195" height="80" rx="10" fill="#ffffff" stroke="#21a97d" stroke-width="2.5"/>
  <text x="347" y="112" text-anchor="middle" font-size="18" font-weight="bold" fill="#344956">Chat</text>
