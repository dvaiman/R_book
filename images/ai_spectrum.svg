  <text x="240" y="182" text-anchor="middle" font-size="13" fill="#8C8C8C">you write, AI answers</text>

  <text x="720" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#344956">AI RUNS, YOU REVIEW</text>
  <rect x="495" y="45" width="450" height="150" rx="14" fill="none" stroke="#344956" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="520" y="80" width="195" height="80" rx="10" fill="#21a97d" stroke="#21a97d" stroke-width="2.5"/>
  <text x="617" y="112" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">Posit Assistant</text>
  <text x="617" y="136" text-anchor="middle" font-size="14" fill="#eaf6f1">your R session</text>
  <rect x="730" y="80" width="195" height="80" rx="10" fill="#21a97d" stroke="#21a97d" stroke-width="2.5"/>
  <text x="827" y="112" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">Claude Code</text>
