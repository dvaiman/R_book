name: Render and Publish Quarto Book

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: release

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          # 'release' keeps CI on the same R the book is written against.
          # dplyr 1.2.0 and ggplot2 4.0 both need R >= 4.1.
          r-version: release
          use-public-rspm: true

      # downlit and xml2 power `code-link: true` and the inline function
      # links built by R/build_function_links.R. Without them Quarto renders
      # the book successfully but emits no links at all.
      - name: Set up R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rmarkdown
            any::knitr
            any::quarto
            any::downlit
            any::xml2
            any::usethis
            any::tidyverse
            any::palmerpenguins
            any::webexercises
            any::here
            any::janitor
            any::lubridate
            any::glue
            any::scales
            any::patchwork
            any::skimr
            any::naniar
            any::GGally
            any::Hmisc
            any::broom
            any::broom.helpers
            any::gt
            any::gtsummary
            any::flextable
            any::DT
            any::readxl
            any::haven
            any::writexl
            any::marginaleffects
            any::emmeans
            any::performance
            any::see
            any::parameters
            any::lme4
            any::broom.mixed
            any::tidymodels
            any::reprex
            any::dagitty
            any::ggdag
            any::EValue
            any::MatchIt
            any::cobalt
            any::targets
            any::tarchetypes
            any::visNetwork

      - name: Render Quarto project
        run: quarto render

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_book

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
