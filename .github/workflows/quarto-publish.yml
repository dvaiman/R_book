name: Render and Publish Quarto Book

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.4.550'  # Use stable version instead of pre-release

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.0'

      - name: Set up R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rmarkdown
            any::knitr
            any::tidyverse
            any::here
            any::janitor
            any::scales
            any::patchwork
            any::gt
            any::gtsummary
            any::flextable
            any::DT
            any::plotly
            any::leaflet
            any::webexercises
            any::palmerpenguins
            any::naniar
            any::skimr
            any::DataExplorer
            any::rcompanion

      - name: Render Quarto Project
        run: |
          quarto render

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_book

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
